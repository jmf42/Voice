services:
  postgres:
    image: postgres:16
    container_name: dispatchos-postgres
    environment:
      POSTGRES_DB: dispatchos
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: dispatch
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dispatch -d dispatchos']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: dispatchos-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
